name: Download and Split Large File
on: 
  workflow_dispatch: # This allows you to click "Run workflow" without a pop-up box

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    env:
      # PASTE YOUR LINK INSIDE THE QUOTES BELOW
      FILE_URL: "https://openload.co/f/DUyLo0TM2A0/www.0xxx.ws_SugarCookie.18.09.04.Valentina.Nappi.And.Mary.Kalisy.Creampie.Threesome.XXX.1080p.MP4-KTR.mp4"
      
    steps:
      - name: Free up space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          # Actions runners have ~14GB SSD space; clearing this gives us more room

      - name: Download File
        run: wget -O bigfile.zip "$FILE_URL"

      - name: Split File into 500MB pieces
        run: |
          mkdir -p chunks
          split -b 500M bigfile.zip chunks/part_

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ github.run_number }}"
          files: chunks/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
