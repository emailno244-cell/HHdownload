name: Download and Split Large File
on: 
  workflow_dispatch: # This allows you to click "Run workflow" without a pop-up box

jobs:
  download-and-split:
    runs-on: ubuntu-latest
    env:
      # PASTE YOUR LINK INSIDE THE QUOTES BELOW
      FILE_URL: "https://str-16.filestore.app/467f95b46c2ec/91ba19441dcf0/a6315626e9056?temp_url_expires=1778172599&temp_url_id=eee02a07-f7dd-4ed3-b0cd-36b0289b0226&countable=true&filename=www.0xxx.ws_PornHub.2026.Serenity.Cox.Friends.Take.Turns.Fucking.Wife.Ending.In.A.Very.Messy.Double.Creampie.And.A.Very.Satisfied.Wife.XXX.1080p.MP4-P2P.mp4&inline=false&content_type=video%2Fmp4&concurrency=1&rate_limit=51200&response_limit=0&ip_access_policy=first&tags=action%3Adownload%2Cfile_type%3Avideo_original%2Cdownload_id%3A57130609212%2Cdownload_type%3Afree%2Cis_server%3Atrue%2Cref_host_id%3A7977%2Cref_uri_id%3A682091320%2Ccountry_code%3ATR%2Cisl%3A08596694%2Cproject%3Ak2s%2Cowner_id%3A36221%2Csite_owner_id%3A36221%2Csize%3A398693669%2Cfile_id%3A1326838336%2Csite_id%3A12123%2Cuser_pc_id%3Ad58e2681c3580%2Cis_partner_side%3Afalse%2Ccts%3A1778086199%2Cdevice_type%3Asmartphone%2Cuser_os%3AAndroid%2Cuser_file_id%3A04cecbdea63fe%2Cuser_id%3A67140184&temp_url_issuer=5445f78a91de707b297e67ed&temp_url_sig=6009afa60fdac9e3116b73ad18daf9fad7fa562d59ea98a26742d5fada48cb01bd6b22471f9a295d465d3e57de72b88248682422a39f14d609045d41110d8ba3&client_ip=149.102.229.168"
      
    steps:
      - name: Free up space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          # Actions runners have ~14GB SSD space; clearing this gives us more room

      - name: Download File
        run: wget -O bigfile.zip "$FILE_URL"

      - name: Split File into 500MB pieces
        run: |
          mkdir -p chunks
          split -b 500M bigfile.zip chunks/part_

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ github.run_number }}"
          files: chunks/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
